[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/football"
  to = "/.netlify/functions/football"
  status = 200

  [redirects.rate_limit]
  window_limit = 20
  window_size = 60
  aggregate_by = ["domain", "ip"]

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
