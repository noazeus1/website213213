<title>Matchbook — Football Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --turf-deep: #0e2018;
  --turf-mid: #163326;
  --turf-line: #456b58;
  --chalk: #f2efe6;
  --chalk-dim: #c9d5cd;
  --gold: #f0c85a;
  --gold-deep: #d4a634;
  --miss: #3a4a41;
  --match-green: #347843;
  --radius: 10px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--turf-deep);
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 140px);
  color: var(--chalk);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.55;
}

h1, h2, .brand-text { font-family: 'Oswald', 'Inter', sans-serif; letter-spacing: 0.01em; }

button { font-family: inherit; cursor: pointer; }

.app-shell { max-width: 980px; margin: 0 auto; padding: 0 20px 64px; }

/* topbar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 18px; border-bottom: 1px solid var(--turf-line);
  margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand-mark { font-size: 22px; }
.brand-text { font-size: 22px; font-weight: 600; color: var(--chalk); }
.topnav { display: flex; gap: 6px; }
.navlink {
  background: transparent; border: 1px solid var(--turf-line); color: var(--chalk-dim);
  padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
  transition: border-color .15s, color .15s;
}
.navlink:hover { color: var(--chalk); border-color: var(--gold-deep); }
.navlink.is-active { color: var(--turf-deep); background: var(--gold); border-color: var(--gold); }

/* hero */
.hero { padding: 12px 0 36px; border-bottom: 1px solid var(--turf-line); margin-bottom: 32px; }
.hero-kicker { color: var(--gold); font-size: 13.5px; font-weight: 500; margin: 0 0 10px; }
.hero h1 { font-size: 38px; font-weight: 600; line-height: 1.12; margin: 0 0 14px; max-width: 640px; }
.hero-sub { color: var(--chalk-dim); max-width: 520px; margin: 0; font-size: 15px; }

/* league cards */
.leagues { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 20px; }
.league-card {
  background: var(--turf-mid); border: 1px solid var(--turf-line); border-radius: var(--radius);
  padding: 20px; cursor: pointer; transition: border-color .15s, transform .1s;
}
.league-card:hover { border-color: var(--gold-deep); }
.league-card h2 { margin: 0 0 4px; font-size: 21px; }
.league-card p { margin: 0 0 12px; color: var(--chalk-dim); font-size: 13.5px; }
.league-teams { display: flex; flex-wrap: wrap; gap: 6px; }
.league-teams span { background: rgba(255,255,255,0.04); border: 1px solid var(--turf-line); padding: 4px 10px; border-radius: 999px; font-size: 12.5px; color: var(--chalk-dim); }

/* section head */
.section-head { margin-bottom: 22px; }
.backlink { background: none; border: none; color: var(--gold); padding: 0; font-size: 13.5px; margin-bottom: 14px; display: block; }
.section-head h1 { font-size: 30px; margin: 0 0 4px; }
.muted { color: var(--chalk-dim); margin: 0; font-size: 14px; }
.muted-inline { color: var(--chalk-dim); font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 400; }
.sub-head { font-size: 19px; margin: 30px 0 14px; font-weight: 600; }

/* table */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; color: var(--chalk-dim); font-weight: 500; font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--turf-line); }
.table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.team-cell { font-weight: 600; }
.row-click { cursor: pointer; }
.row-click:hover td { background: rgba(224,178,60,0.06); }
.totals-row td { border-top: 1px solid var(--turf-line); font-weight: 600; color: var(--gold); }

/* stat strip */
.stat-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
.stat-strip div { background: var(--turf-mid); border: 1px solid var(--turf-line); border-radius: var(--radius); padding: 14px 18px; min-width: 100px; }
.stat-strip span { display: block; font-family: 'Oswald', sans-serif; font-size: 24px; color: var(--gold); }
.stat-strip div { font-size: 12px; color: var(--chalk-dim); }

/* roster */
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.player-card {
  display: flex; align-items: center; gap: 12px; background: var(--turf-mid); border: 1px solid var(--turf-line);
  border-radius: var(--radius); padding: 12px 14px; cursor: pointer; transition: border-color .15s;
}
.player-card:hover { border-color: var(--gold-deep); }
.player-num { font-family: 'Oswald', sans-serif; font-size: 20px; color: var(--gold); width: 32px; text-align: center; }
.player-name { font-weight: 600; font-size: 14.5px; }
.player-meta { color: var(--chalk-dim); font-size: 12.5px; }

/* player hero */
.player-hero { display: flex; align-items: center; gap: 16px; }
.player-hero-num { font-family: 'Oswald', sans-serif; font-size: 40px; color: var(--gold); width: 56px; }
.player-hero h1 { font-size: 28px; margin: 0 0 4px; }

.fact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 8px; }
.fact { background: var(--turf-mid); border: 1px solid var(--turf-line); border-radius: var(--radius); padding: 12px 14px; }
.fact span { display: block; font-size: 11.5px; color: var(--chalk-dim); margin-bottom: 4px; }
.fact strong { font-size: 15px; }

/* timeline */
.timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--turf-line); }
.timeline li { position: relative; padding: 0 0 16px 20px; }
.timeline li::before { content: ''; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--turf-line); }
.timeline li.is-current::before { background: var(--gold); }
.timeline-year { font-family: 'Oswald', sans-serif; color: var(--gold); font-size: 13px; }
.timeline-body { font-size: 14.5px; }

/* rumor */
.rumor-card { background: rgba(224,178,60,0.08); border: 1px solid var(--gold-deep); border-radius: var(--radius); padding: 14px 16px; }
.rumor-tag { display: inline-block; background: var(--gold); color: var(--turf-deep); font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-bottom: 8px; }
.rumor-card p { margin: 0; font-size: 14px; }

.notice { margin-top: 32px; color: var(--chalk-dim); font-size: 12px; border-top: 1px solid var(--turf-line); padding-top: 14px; }

/* game */
.game-panel { background: var(--turf-mid); border: 1px solid var(--turf-line); border-radius: var(--radius); padding: 22px; }
.guess-form { display: flex; gap: 8px; margin-bottom: 10px; }
.guess-form input { flex: 1; background: var(--turf-deep); border: 1px solid var(--turf-line); color: var(--chalk); padding: 11px 14px; border-radius: 8px; font-size: 14.5px; }
.guess-form input:focus { outline: none; border-color: var(--gold); }
.guess-form button, .ghost-btn { background: var(--gold); color: var(--turf-deep); border: none; padding: 11px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.ghost-btn { background: transparent; border: 1px solid var(--turf-line); color: var(--chalk-dim); margin-bottom: 22px; }

.hint-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.hint-row { display: flex; justify-content: space-between; padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid var(--turf-line); }
.hint-row.is-open .hint-value { color: var(--gold); font-weight: 600; }
.hint-label { color: var(--chalk-dim); font-size: 13px; }
.hint-value { font-size: 13.5px; }

.guess-history { display: flex; flex-direction: column; gap: 6px; }
.guess-row { display: grid; grid-template-columns: 1.6fr 1.4fr 0.7fr 1fr 1fr; gap: 6px; }
.chip { padding: 9px 8px; border-radius: 6px; font-size: 12.5px; text-align: center; background: var(--miss); }
.chip.name { background: rgba(255,255,255,0.05); text-align: left; font-weight: 600; }
.chip.match { background: var(--match-green); color: #fff; font-weight: 600; }
.chip.partial, .chip.lower, .chip.higher { background: #5b4a1b; color: var(--gold); }

.win-banner { margin-top: 18px; background: rgba(76,154,95,0.15); border: 1px solid var(--match-green); border-radius: var(--radius); padding: 16px; }
.win-banner button { margin-top: 10px; background: var(--gold); color: var(--turf-deep); border: none; padding: 9px 16px; border-radius: 8px; font-weight: 600; }

@media (max-width: 560px) {
  .hero h1 { font-size: 28px; }
  .guess-row { grid-template-columns: 1fr; }
  .chip { text-align: left; }
}


/* accessibility, responsive layout, media and legal/footer additions */
html { scroll-behavior: smooth; }
body { min-height: 100vh; min-height: 100dvh; }
a { color: var(--gold); text-underline-offset: 3px; }
a:hover { color: #ffe08a; }
img { max-width: 100%; height: auto; }
button, input, a { -webkit-tap-highlight-color: transparent; }
button, .navlink, .ghost-btn, .primary-cta { min-height: 44px; touch-action: manipulation; }
button:focus-visible, input:focus-visible, a:focus-visible, [role="button"]:focus-visible {
  outline: 3px solid #fff2a8; outline-offset: 3px;
}
.skip-link { position: fixed; left: 12px; top: 12px; transform: translateY(-150%); z-index: 9999; background: #fff; color: #07120d; padding: 10px 14px; border-radius: 8px; font-weight: 700; }
.skip-link:focus { transform: translateY(0); }
.brand { appearance: none; border: 0; background: transparent; padding: 8px 0; color: inherit; min-height: 44px; }
.brand-mark { line-height: 1; }
.primary-cta { display: inline-flex; align-items: center; justify-content: center; margin-top: 20px; padding: 11px 18px; border-radius: 8px; border: 1px solid var(--gold); background: var(--gold); color: var(--turf-deep); font-weight: 750; text-decoration: none; }
.primary-cta:hover { color: var(--turf-deep); background: #ffda72; }
.form-note, .field-error { font-size: 12.5px; color: var(--chalk-dim); margin: -2px 0 12px; }
.field-error { color: #ffd4cb; }
.honeypot { position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip: rect(0 0 0 0) !important; white-space: nowrap !important; }
.table-wrap { width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; -webkit-overflow-scrolling: touch; border-radius: var(--radius); }
.table { min-width: 680px; }
.media-slot { position: relative; flex: 0 0 auto; width: 56px; height: 56px; border-radius: 12px; border: 1px solid var(--turf-line); background: rgba(255,255,255,0.035); display: grid; place-items: center; overflow: hidden; }
.media-slot.badge { width: 42px; height: 42px; border-radius: 10px; }
.media-slot.hero-media { width: 132px; height: 132px; border-radius: 16px; }
.media-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.media-slot.badge img { object-fit: contain; padding: 3px; }
.media-fallback { font-weight: 800; letter-spacing: .04em; color: var(--gold); font-size: 13px; text-align: center; padding: 4px; }
.media-license { position: absolute; inset: auto 2px 2px 2px; background: rgba(4,12,8,.82); color: #fff; border-radius: 4px; padding: 1px 3px; font-size: 8px; line-height: 1.2; text-align: center; text-decoration: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.media-license:hover { color: #fff; }
.team-title, .player-hero { display: flex; align-items: center; gap: 16px; }
.team-title-copy { min-width: 0; }
.team-cell-inner { display: flex; align-items: center; gap: 9px; min-width: 165px; }
.player-card > div:last-child { min-width: 0; }
.player-name, .player-meta { overflow-wrap: anywhere; }
.empty-media-note { font-size: 10px; color: var(--chalk-dim); text-align: center; line-height: 1.1; }
.site-footer { border-top: 1px solid var(--turf-line); margin-top: 48px; padding: 24px 0 8px; display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; color: var(--chalk-dim); font-size: 12.5px; }
.footer-links { display: flex; gap: 14px; flex-wrap: wrap; }
.cookie-banner { position: fixed; z-index: 9000; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; background: #183c2b; border: 1px solid #71927f; box-shadow: 0 12px 40px rgba(0,0,0,.45); border-radius: 12px; padding: 16px; }
.cookie-banner p { margin: 0 0 12px; color: var(--chalk); font-size: 13.5px; }
.cookie-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.cookie-actions button { border-radius: 8px; padding: 9px 14px; font-weight: 700; border: 1px solid var(--gold); }
.cookie-accept { background: var(--gold); color: var(--turf-deep); }
.cookie-reject { background: transparent; color: var(--chalk); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
@media (max-width: 720px) {
  .app-shell { padding: 0 14px calc(36px + env(safe-area-inset-bottom)); }
  .topbar { align-items: stretch; }
  .topnav { width: 100%; overflow-x: auto; padding-bottom: 3px; scrollbar-width: thin; }
  .topnav .navlink { flex: 0 0 auto; }
  .hero { padding-bottom: 26px; margin-bottom: 24px; }
  .leagues { grid-template-columns: 1fr; }
  .stat-strip { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat-strip div { min-width: 0; }
  .team-title, .player-hero { align-items: flex-start; }
}
@media (max-width: 560px) {
  .guess-form { flex-direction: column; }
  .guess-form button { width: 100%; }
  .guess-form input { font-size: 16px; }
  .roster { grid-template-columns: 1fr; }
  .player-card { padding: 12px; }
  .media-slot.hero-media { width: 104px; height: 104px; }
  .section-head h1 { font-size: 27px; }
  .site-footer { flex-direction: column; }
}

</style>
</head>

<div id="consent-root"></div>
<script>
// Public client configuration only. Never put passwords, private API keys or database credentials in this file.
const PUBLIC_CONFIG = Object.freeze({
  analyticsMeasurementId: document.querySelector('meta[name="matchbook-ga-id"]')?.content.trim() || '',
  usesAdvertisingCookies: false,
  commonsApi: 'https://commons.wikimedia.org/w/api.php',
  wikidataApi: 'https://www.wikidata.org/w/api.php'
});

// Browser-side HTTPS fallback. Production hosting should also enforce HTTPS at the edge/server (see included configs).
if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
  location.replace('https://' + location.host + location.pathname + location.search + location.hash);
}

document.getElementById('footer-year').textContent = String(new Date().getFullYear());

function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function storageSet(key,value) { try { localStorage.setItem(key,value); } catch {} }
const analyticsState = { loaded:false, consent:storageGet('matchbook-analytics-consent') || 'unset' };
function analyticsConfigured() { return /^G-[A-Z0-9]+$/i.test(PUBLIC_CONFIG.analyticsMeasurementId); }
function loadAnalytics() {
  if (!analyticsConfigured() || analyticsState.loaded || analyticsState.consent !== 'granted') return;
  analyticsState.loaded = true;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', PUBLIC_CONFIG.analyticsMeasurementId, { anonymize_ip:true, allow_google_signals:false, allow_ad_personalization_signals:false });
  const script = document.createElement('script');
  script.async = true;
  script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(PUBLIC_CONFIG.analyticsMeasurementId);
  document.head.appendChild(script);
}
function trackEvent(name, params = {}) {
  if (analyticsState.loaded && typeof window.gtag === 'function') window.gtag('event', name, params);
}
function setAnalyticsConsent(value) {
  analyticsState.consent = value;
  storageSet('matchbook-analytics-consent', value);
  document.getElementById('consent-root').innerHTML = '';
  if (value === 'granted') loadAnalytics();
}
function renderConsentIfNeeded() {
  // No banner is shown when analytics is unconfigured and the app remains cookieless/no-ads by default.
  if (!analyticsConfigured() || analyticsState.consent !== 'unset') { loadAnalytics(); return; }
  document.getElementById('consent-root').innerHTML = `<aside class="cookie-banner" role="dialog" aria-modal="false" aria-labelledby="cookie-title"><p id="cookie-title"><strong>Optional analytics</strong><br>Matchbook can use Google Analytics only after you consent. Advertising cookies are disabled. You can keep using the site without analytics.</p><div class="cookie-actions"><button type="button" class="cookie-accept" data-consent="granted">Allow analytics</button><button type="button" class="cookie-reject" data-consent="denied">Decline</button><a href="./privacy.html">Privacy details</a></div></aside>`;
}
document.getElementById('consent-root').addEventListener('click', event => {
  const value = event.target?.dataset?.consent;
  if (value === 'granted' || value === 'denied') setAnalyticsConsent(value);
});
renderConsentIfNeeded();

function updateMeta(title, description) {
  document.title = title;
  const set = (selector, value) => { const node = document.querySelector(selector); if (node) node.setAttribute('content', value); };
  set('meta[name="description"]', description);
  set('meta[property="og:title"]', title);
  set('meta[property="og:description"]', description);
  set('meta[name="twitter:title"]', title);
  set('meta[name="twitter:description"]', description);
}

const formGuard = new Map();
function formAllowed(key, minGapMs = 900, perMinute = 30) {
  const now = Date.now(), previous = formGuard.get(key) || [];
  const recent = previous.filter(t => now - t < 60000);
  if ((recent.length && now - recent[recent.length - 1] < minGapMs) || recent.length >= perMinute) return false;
  recent.push(now); formGuard.set(key, recent); return true;
}
function safeSearchText(value) {
  const text = String(value || '').trim().replace(/\s+/g,' ');
  return text.length >= 3 && text.length <= 100 && !/[<>]/.test(text) ? text : null;
}

const commonsMediaCache = new Map();
const FREE_LICENSE = /^(CC0|Public domain|CC BY(?:-|\s)|CC BY-SA(?:-|\s))/i;
function plainText(value) {
  const el = document.createElement('div'); el.innerHTML = String(value || ''); return (el.textContent || '').replace(/\s+/g,' ').trim();
}
function initials(value) {
  return String(value || '?').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase() || '?';
}
function mediaSlot(kind, subject, context = '', hero = false) {
  const alt = kind === 'team' ? `${subject} club badge` : `${subject} footballer photo`;
  return `<span class="media-slot ${kind === 'team' ? 'badge' : ''} ${hero ? 'hero-media' : ''}" data-free-media data-kind="${esc(kind)}" data-subject="${esc(subject)}" data-context="${esc(context)}" data-alt="${esc(alt)}" data-width="${hero ? 320 : kind === 'team' ? 96 : 144}" aria-label="${esc(alt)}"><span class="media-fallback" aria-hidden="true">${esc(initials(subject))}</span></span>`;
}
function commonsUrl(value, hosts) {

    <h2 class="sub-head">Player statistics <span class="muted-inline">(${esc(p.season)})</span></h2>
    <div class="table-wrap"><table class="table"><thead><tr><th>Season</th><th>Club</th><th>Apps</th><th>Goals</th><th>Assists</th></tr></thead><tbody><tr><td>${esc(p.season)}</td><td>${esc(team.name)}</td><td>${shown(displayStat(p.stats,['appearances']))}</td><td>${shown(displayStat(p.stats,['totalGoals']))}</td><td>${shown(displayStat(p.stats,['goalAssists']))}</td></tr></tbody></table></div>
    ${p.stats.length ? `<h2 class="sub-head">Season detail</h2><div class="fact-grid">${p.stats.map(s => fact(s.displayName || s.name,present(s.displayValue) ? s.displayValue : s.value,'Free source')).join('')}</div>` : '<p class="muted">The free squad source does not currently provide reliable season statistics for every player. Missing values are not treated as zero.</p>'}
    <p class="muted">Player identity, squad role and available biographical fields come from TheSportsDB. Detailed season statistics are shown only when a supported free source actually supplies them.</p>
    <h2 class="sub-head">Clubs played for</h2>
    ${!extra || extra.status === 'loading' ? '<p class="muted">Loading club-history and contract records…</p>' : ''}
    ${transfers.length ? `<ol class="timeline">${transfers.map(t => `<li><div class="timeline-year">${shown(t.joined)} — ${shown(t.departed)}</div><div class="timeline-body"><strong>${shown(t.team)}</strong>${t.type ? `<span class="muted"> — ${esc(t.type)}</span>` : ''}</div></li>`).join('')}</ol><p class="muted">These are provider-reported club-history records and may be incomplete; they are not treated as a complete transfer-fee log.</p>` : extra && extra.status !== 'loading' ? '<p class="muted">No club-history records were returned for this player.</p>' : ''}
    <h2 class="sub-head">Contract information</h2><p class="muted">${esc(contract.note)} The free source may return only one contract record. A former club’s contract is never applied to this club.</p>
    ${list(extra?.contracts).length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Club in source</th><th>Reported start</th><th>Reported end</th></tr></thead><tbody>${extra.contracts.map(c => `<tr><td>${shown(c.strTeam)}</td><td>${shown(c.strYearStart)}</td><td>${shown(c.strYearEnd)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${list(extra?.errors).map(message => `<p class="muted" role="status">${esc(message)}</p>`).join('')}
    ${extra?.status !== 'loading' ? actionButton('Refresh extra details','player-refresh',id) : ''}
    ${list(extra?.sources).length ? `<p class="muted">${extra.sources.map(s => sourceLink(s.url,s.label)).join(' · ')} · Retrieved ${esc(formatTimestamp(extra.refreshed))}</p>` : ''}${dataNotice()}`;
  hydrateFreeMedia(); trackEvent('page_view',{page:'player'});
  if (!extra) void loadPlayerDetails(id);
}

function normaliseEvent(event) {
  const status=event.fixture?.status || {}, short=status.short || '';
  const pre=new Set(['TBD','NS','PST']), post=new Set(['FT','AET','PEN','CANC','ABD','AWD','WO']);
  const state=pre.has(short)?'pre':post.has(short)?'post':'in';
  return {id:event.fixture?.id,league:event.league?.name||null,home:event.teams?.home?.name||null,away:event.teams?.away?.name||null,
    homeScore:state==='pre'?null:event.goals?.home,awayScore:state==='pre'?null:event.goals?.away,state,
    status:status.long || short || null,date:event.fixture?.date||null,possession:[null,null],shots:[null,null]};
}
async function loadMatches(force=false) {
  if (matchFeed.status==='loading') return;
  matchFeed={status:'loading',matches:[],refreshed:null,error:null};
  if (state.view==='matches') renderMatches();
  try {
    const data=await apiJSON('fixtures',{date:today(),timezone:'UTC'},force?0:60*1000);
    if (!Array.isArray(data.response)) throw new Error('The hybrid free sources did not return a fixture list.');
    matchFeed={status:'ready',matches:data.response.map(normaliseEvent).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date)),refreshed:new Date().toISOString(),sourceUrl:safeUrl(data.source?.url)||API_SOURCE,sourceName:data.source?.name||'Hybrid free/open fixture feed',error:null};
  } catch(error) { matchFeed={status:'error',matches:[],refreshed:null,error:errorMessage(error)}; }
  if (state.view==='matches') renderMatches();
}
function renderMatches() {
  updateMeta('Football matches — Matchbook','Upcoming and finished football matches returned by Matchbook’s free/open source combination.');
  const ready = matchFeed.status === 'ready', matches = matchFeed.matches;
  app.innerHTML = `${topbar('matches')}<section class="section-head"><h1>Football matches</h1><p class="muted">${DATA_AS_OF} · ${ready ? 'Retrieved '+esc(formatTimestamp(matchFeed.refreshed)) : esc(busyOrError(matchFeed.status === 'idle' ? 'loading' : matchFeed.status,matchFeed.error,'fixtures'))}</p></section>
    <div class="stat-strip">${[['Live','in'],['Upcoming','pre'],['Finished','post']].map(([label,key]) => `<div><span>${ready ? matches.filter(m => m.state === key).length : '—'}</span>${label}</div>`).join('')}<div><span>${ready ? matches.length : '—'}</span>Matches returned</div></div>
    ${matchFeed.status !== 'loading' ? actionButton('Refresh results','matches-refresh') : ''}
    <div class="table-wrap"><table class="table"><thead><tr><th>Competition</th><th>Match</th><th>Score</th><th>Status</th><th>Match stats</th></tr></thead><tbody>${matches.map(m => `<tr><td>${shown(m.league)}</td><td class="team-cell">${shown(m.home)} — ${shown(m.away)}</td><td><strong>${shown(m.homeScore)}–${shown(m.awayScore)}</strong></td><td>${shown(m.status)}</td><td>Poss ${m.possession.map(v => present(v) ? esc(v) : '—').join('–')} · Shots ${m.shots.map(v => present(v) ? esc(v) : '—').join('–')}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No fixtures to display. Feed errors do not mean no matches are taking place.</td></tr>'}</tbody></table></div>
    ${matchFeed.sourceUrl ? `<p class="muted">${sourceLink(matchFeed.sourceUrl,'Source: '+(matchFeed.sourceName || 'hybrid fixture feed'))} · Free coverage is partial; a dash means not supplied.</p>` : ''}${dataNotice()}`;
  trackEvent('page_view',{page:'matches'});
  if (matchFeed.status === 'idle') void loadMatches();
}

// Game facts come from fetched squads too, never from the removed demo archive.
function gameCandidates() {
  const unique = new Map();
  for (const p of players.values()) {
    if (playerAge(p) === null || !p.position || !teams.get(p.teamId)?.competition) continue;
    const previous = unique.get(p.sourceId);
    if (!previous || p.refreshed >= previous.refreshed) unique.set(p.sourceId,p);
  }
  return [...unique.values()];
}
async function prepareGame() {
  if (game.status==='loading') return;
  game.status='loading'; game.error=null;
  if (state.view==='game') renderGame();
  try {
    if (gameCandidates().length < 12) {
      const league=LEAGUES.find(l=>l.id==='epl');
      await resolveLeagueProvider(league);
      const data=await apiJSON('teams',{league:league.providerId,season:league.providerSeason},12*60*60*1000);
      const featured=list(data.response).slice(0,1).map(entry=>registerTeam(entry,{leagueId:league.id,competition:league.name,country:league.country,providerLeagueId:league.providerId,providerSeason:league.providerSeason})).filter(Boolean);
      for (const team of featured) await loadRoster(team.id,true);
    }
    if (!gameCandidates().length) throw new Error('No sourced players are available. Load a team squad or retry when the free sources are reachable.');
    game.status='ready'; newGame();
  } catch(error) { game.status='error'; game.error=errorMessage(error); if (state.view==='game') renderGame(); }
}
function newGame() {
  const pool = gameCandidates();
  if (!pool.length) { void prepareGame(); return; }
  game = {...game,status:'ready',target:pool[Math.floor(Math.random()*pool.length)],pool:[...pool],guesses:[],won:false,lost:false,error:null};
  if (state.view === 'game') renderGame();
}
function setDifficulty(id) {
  if (!DIFFICULTIES[id]) return;
  game.difficulty = id; newGame();
}
function hintsRevealed() {
  const d = DIFFICULTIES[game.difficulty];
  const wrong = game.guesses.filter(p => p.sourceId !== game.target?.sourceId).length;
  return Math.min(d.freeHints + Math.floor(wrong/d.revealEvery),6);
}
function hintRows() {
  const p = game.target, team = teams.get(p.teamId), revealed = game.won || game.lost ? 6 : hintsRevealed();
  return [['League',team.competition],['Position',p.position],['Nationality',p.nationality],['Squad number',p.number],['Age',playerAge(p)],['Current squad',team.name]].map(([label,value],i) => `<div class="hint-row ${i < revealed ? 'is-open' : ''}"><span class="hint-label">${label}</span><span class="hint-value">${i < revealed ? shown(value) : '— locked, guess to reveal —'}</span></div>`).join('');
}
function renderGuessRow(p) {
  const t = game.target, guessAge = playerAge(p), targetAge = playerAge(t), cmp = (a,b) => a === b ? 'match' : 'miss';
  return `<div class="guess-row"><span class="chip name">${esc(p.name)}</span><span class="chip ${cmp(p.teamId,t.teamId)}">${esc(teams.get(p.teamId).name)}</span><span class="chip ${cmp(p.pos,t.pos)}">${shown(p.pos)}</span><span class="chip ${cmp(p.nationality,t.nationality)}">${esc(p.nationality)}</span><span class="chip ${guessAge === targetAge ? 'match' : 'partial'}">${guessAge} ${guessAge < targetAge ? '↑ older' : guessAge > targetAge ? '↓ younger' : ''}</span></div>`;
}
function renderGame() {
  updateMeta('Guess the Footballer — Matchbook','Play Guess the Footballer using real players loaded from sourced current squad feeds.');
  const d = DIFFICULTIES[game.difficulty];
  if (!game.target) {
    app.innerHTML = `${topbar('game')}<section class="section-head"><h1>Guess the Footballer</h1><p class="muted">${esc(game.error || 'Loading real players from the free squad feed…')}</p></section>${game.status === 'error' ? actionButton('Retry loading players','game-retry') : ''}${dataNotice()}`;
    if (game.status === 'idle') void prepareGame();
    return;
  }
  const ended = game.won || game.lost;
  app.innerHTML = `${topbar('game')}<section class="section-head"><h1>Guess the Footballer</h1><p class="muted">Unlimited plays. Guess from ${game.pool.length} players loaded from real squads. Browse more teams to expand the next round.</p></section>
    <div class="game-panel"><p class="muted">Difficulty · ${d.freeHints} starting hints, a hint every ${d.revealEvery} miss${d.revealEvery === 1 ? '' : 'es'}, ${d.maxGuesses ? d.maxGuesses+' guesses' : 'unlimited guesses'}. ${d.maxGuesses ? Math.max(0,d.maxGuesses-game.guesses.length)+' remaining.' : ''}</p>
      <div class="topnav">${Object.entries(DIFFICULTIES).map(([id,v]) => actionButton(v.label,'difficulty',id,'navlink '+(id === game.difficulty ? 'is-active' : ''))).join('')}</div><br />
      <form id="guess-form" class="guess-form"><input list="player-names" id="guess-input" aria-label="Guess a player" placeholder="Type a player name…" autocomplete="off" enterkeyhint="done" required ${ended ? 'disabled' : ''} /><datalist id="player-names">${game.pool.map(p => `<option value="${esc(p.name)} — ${esc(teams.get(p.teamId).name)}"></option>`).join('')}</datalist><button type="submit" ${ended ? 'disabled' : ''}>Guess</button></form>
      <p id="guess-message" class="muted" role="status"></p>${actionButton('New player','new-game')}<div class="hint-list">${hintRows()}</div><div class="guess-history">${game.guesses.map(renderGuessRow).join('')}</div>
      ${ended ? `<div class="win-banner"><div class="player-hero">${mediaSlot('player',game.target.name,teams.get(game.target.teamId).name)}<div><strong>${game.won ? 'Correct' : 'Out of guesses'} — it was ${esc(game.target.name)}.</strong><p>${shown(game.target.position)} in ${esc(teams.get(game.target.teamId).name)}’s squad.</p></div></div>${actionButton('Play again','new-game')}</div>` : ''}</div>${dataNotice()}`;
  hydrateFreeMedia(); trackEvent('page_view',{page:'game'});
  if (!ended) document.getElementById('guess-input')?.focus();
}
function submitGuess(event) {
  event.preventDefault();
  if (!game.target || game.won || game.lost) return false;
  const input = document.getElementById('guess-input'), name = normalName(input.value.trim());
  const matched = game.pool.filter(p => normalName(p.name) === name || normalName(p.name+' — '+teams.get(p.teamId).name) === name);
  const message = document.getElementById('guess-message');
  if (matched.length !== 1) { message.textContent = matched.length ? 'Choose the player and club from the suggestions to avoid namesakes.' : 'Choose a player from this round’s suggestions.'; return false; }
  const p = matched[0];
  if (game.guesses.some(g => g.sourceId === p.sourceId)) { message.textContent = 'You already guessed that player.'; return false; }
  game.guesses.push(p); game.won = p.sourceId === game.target.sourceId;
  const limit = DIFFICULTIES[game.difficulty].maxGuesses;
  game.lost = !game.won && !!limit && game.guesses.length >= limit;
  renderGame(); return false;
}

app.addEventListener('click', event => {
  const control = event.target.closest('[data-action]');
  if (!control || !app.contains(control)) return;
  const action = control.dataset.action, id = control.dataset.id;
  if (action === 'home') nav('home');
  if (action === 'focus-search') { document.getElementById('team-search-input')?.focus(); document.getElementById('team-search-input')?.scrollIntoView({behavior:'smooth',block:'center'}); }
  if (action === 'league') nav('league',{leagueId:id});
  if (action === 'team') nav('team',{teamId:id});
  if (action === 'player') nav('player',{playerId:id});
  if (action === 'game') nav('game');
  if (action === 'matches') openResultsWindow();
  if (action === 'search-more' && searchState.status !== 'loading') void searchTeams(searchState.query,true);
  if (action === 'table-refresh') void loadTable(id,true);
  if (action === 'roster-refresh') void loadRoster(id,true);
  if (action === 'player-refresh') void loadPlayerDetails(id,true);
  if (action === 'matches-refresh') void loadMatches(true);
  if (action === 'difficulty') { trackEvent('difficulty_change',{difficulty:id}); setDifficulty(id); }
  if (action === 'new-game') { trackEvent('new_game'); newGame(); }
  if (action === 'game-retry') void prepareGame();
});
app.addEventListener('keydown', event => {
  const target = event.target;
  if ((event.key === 'Enter' || event.key === ' ') && target.getAttribute('role') === 'button' && target.dataset.action) { event.preventDefault(); target.click(); }
});
app.addEventListener('submit', event => {
  if (event.target.id === 'team-search-form') {
    event.preventDefault();
    const input = document.getElementById('team-search-input'), error = document.getElementById('team-search-error');
    const value = safeSearchText(input.value);
    if (document.getElementById('website-field')?.value) { error.textContent = 'Request rejected.'; return; }
    if (!value) { error.textContent = 'Enter a team name using 3–100 characters and no angle brackets.'; input.setAttribute('aria-invalid','true'); input.focus(); return; }
    if (!formAllowed('team-search')) { error.textContent = 'Too many searches too quickly. Please wait a moment and try again.'; input.setAttribute('aria-invalid','true'); return; }
    error.textContent = ''; input.removeAttribute('aria-invalid'); trackEvent('team_search',{query_length:value.length}); void searchTeams(value);
  }
  if (event.target.id === 'guess-form') submitGuess(event);
});
render();
</script>
